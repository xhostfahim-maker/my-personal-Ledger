<style>

h1{font-size:20px;margin:0;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}h3{margin:12px 0 8px}

textarea{width:100%;min-height:150px}.pl{cursor:pointer}
@media print{.tabs,header button,.fl,.noprint{display:none!important}body{background:#fff;color:#000}.card{background:#fff;box-shadow:none;border-color:#ccc}}
</style></head><body><div id="app"></div><div id="md" class="md" hidden onclick="if(event.target==this)closeM()"><div class="card mc" id="mc"></div></div><div id="ts" hidden></div>

newGoal:['নতুন সঞ্চয় লক্ষ্য','New savings goal'],bad:['ডেটা সঠিক নয়','Invalid data'],ledger:['ব্যক্তির খাতা','Ledger']};
const C={Food:['খাবার','Food'],Transport:['যাতায়াত','Transport'],Shopping:['কেনাকাটা','Shopping'],Education:['শিক্ষা','Education'],Internet:['ইন্টারনেট','Internet'],Gaming:['গেমিং','Gaming'],Bills:['বিল','Bills'],Family:['পরিবার','Family'],Other:['অন্যান্য','Other'],Cash:['নগদ','Cash'],bKash:['bKash','bKash'],Nagad:['Nagad','Nagad'],Bank:['ব্যাংক','Bank']};

let S={tx:[],persons:[],goals:[],lang:'bn'},V='dash',PID=null,CX={},F={q:'',type:'',cat:'',from:'',to:'',min:'',max:'',sort:'new'},R={from:'',to:''};
function persist(){try{localStorage.setItem('hk',JSON.stringify(S))}catch(e){}}
function toast(m,bad){const e=$('ts');e.textContent=m;e.style.color=bad?'var(--bad)':'var(--ok)';e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2500)}

function pst(id,arr=S.tx){const r={lent:0,rin:0,bor:0,rout:0},k={lend:'lent',rin:'rin',borrow:'bor',rout:'rout'};arr.forEach(x=>{if(x.pid==id&&k[x.type])r[k[x.type]]+=x.amount});return r}
const stt=(a,b)=>!a?'':b>=a-.005?'paid':b>0?'part':'unpaid',okLoans=(arr,ps)=>ps.every(p=>{const s=pst(p.id,arr);return s.lent-s.rin>=-.005&&s.bor-s.rout>=-.005});

[[0,'Food',350],[0,'Transport',80],[1,'Internet',600],[2,'Food',420],[3,'Shopping',1800],[5,'Bills',2200],[8,'Gaming',500],[10,'Family',3000],[34,'Food',900]].forEach(e=>T(e[0],'expense',e[2],e[1],'Cash'));

function row(x,act=1){const y=TY[x.type],p=x.pid?person(x.pid):null;return `<div class=row><span class="b ${y.c}">${t(x.type)}</span><div class=g1><b>${p?esc(p.name):esc(t2(x.cat))}</b><small>${fdt(x.date)} · ${t2(x.method)}${x.due?' · ⏳'+x.due:''}${x.note?' · '+esc(x.note):''}</small></div><b class="${y.c}">${y.s>0?'+':'−'}${fmt(x.amount)}</b>${act?`<button class=i onclick="frm('${x.id}')">✎</button><button class=i onclick="delTx('${x.id}')">🗑</button>`:''}</div>`}
function frm(id,ty,pid){CX=id?S.tx.find(a=>a.id==id):{type:ty||'expense',date:new Date().toISOString(),method:'Cash',pid};
open(`<h3>${id?t('edit'):t('add')}</h3><label>${t('type')}<select id=f_type onchange=ftype()>${Object.keys(TY).map(k=>`<option value=${k} ${k==CX.type?'selected':''}>${t(k)}</option>`).join('')}</select></label>

function saveTx(id){const v=k=>$(k)?$(k).value:'',ty=v('f_type'),a=Math.round(+v('f_amt')*100)/100;

function chart(){const cur=today().slice(0,7),ms=[];for(let i=5;i>=0;i--){const[y,m]=cur.split('-').map(Number);ms.push(new Date(Date.UTC(y,m-1-i,1)).toISOString().slice(0,7))}

<select onchange="F.type=this.value;LL()"><option value="">${t('all')}</option>${Object.keys(TY).map(k=>`<option value=${k} ${F.type==k?'selected':''}>${t(k)}</option>`).join('')}</select>
<select onchange="F.cat=this.value;LL()"><option value="">${t('cat')}</option>${EC.map(k=>`<option value=${k} ${F.cat==k?'selected':''}>${t2(k)}</option>`).join('')}</select>
${i('from','date','','135px')}${i('to','date','','135px')}${i('min','number',t('min'),'90px')}${i('max','number',t('max'),'90px')}
<select onchange="F.sort=this.value;LL()">${['new','old','hi','lo'].map(k=>`<option value=${k} ${F.sort==k?'selected':''}>${t(k)}</option>`).join('')}</select></div><div id=list></div></div>`}
const stb=(a,b)=>{const s=stt(a,b);return s?`<span class="b ${s=='paid'?'ok':s=='part'?'warn':'bad'}">${t(s)}</span>`:''};
function vDhar(){const ps=S.persons.filter(p=>S.tx.some(x=>x.pid==p.id)),L=sum('lend',()=>1)-sum('rin',()=>1),B=sum('borrow',()=>1)-sum('rout',()=>1);
return `<div class=card><div class=bt>${['lend','borrow','rin','rout'].map(k=>`<button class=p onclick="frm(null,'${k}')">＋ ${t(k)}</button>`).join('')}</div></div><div class=gr>${card(t('owedMe'),L,'ok')}${card(t('iOwe'),B,'bad')}</div>
<div class=card>${ps.map(p=>{const s=pst(p.id);return `<div class="row pl" onclick="go('led','${p.id}')"><div class=g1><b>${esc(p.name)}</b><small>${esc(p.phone||'')}</small></div><div style="text-align:right">${s.lent?`<small>${t('theyOwe')}</small><b class=ok>${fmt(s.lent-s.rin)}</b> ${stb(s.lent,s.rin)}`:''}${s.bor?`<small>${t('iOwe')}</small><b class=bad>${fmt(s.bor-s.rout)}</b> ${stb(s.bor,s.rout)}`:''}</div></div>`}).join('')||t('none')}</div>`}
function vLed(){const p=person(PID);if(!p)return vDhar();const s=pst(p.id);
return `<button onclick="go('dhar')">${t('back')}</button><h3>${t('ledger')}: ${esc(p.name)} ${esc(p.phone||'')}</h3><div class=gr>${card(t('lent'),s.lent,'warn')}${card(t('rinT'),s.rin,'ok')}${card(t('theyOwe'),s.lent-s.rin,'ok')}${card(t('bor'),s.bor,'warn')}${card(t('routT'),s.rout,'bad')}${card(t('iOwe'),s.bor-s.rout,'bad')}</div>
<div class=card><div class=bt><button class=p onclick="frm(null,'rin','${p.id}')">＋ ${t('rin')}</button><button class=p onclick="frm(null,'rout','${p.id}')">＋ ${t('rout')}</button><button onclick="frm(null,'lend','${p.id}')">＋ ${t('lend')}</button><button onclick="frm(null,'borrow','${p.id}')">＋ ${t('borrow')}</button></div>
${[...S.tx].filter(x=>x.pid==p.id).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>row(x)).join('')}</div>`}
function rng(){return S.tx.filter(x=>{const d=dkey(x.date);return d>=R.from&&d<=R.to})}
function setR(k){R.to=today();R.from=k=='d'?today():k=='w'?dkey(ago(6)):today().slice(0,8)+'01';render()}
function vRep(){if(!R.from)setR('m');const a=rng(),I=a.filter(x=>x.type=='income').reduce((s,x)=>s+x.amount,0),E=a.filter(x=>x.type=='expense').reduce((s,x)=>s+x.amount,0),cs={};
a.filter(x=>x.type=='expense').forEach(x=>cs[x.cat]=(cs[x.cat]||0)+x.amount);const mx=Math.max(1,...Object.values(cs));
return `<div class=card><div class=fl><button onclick="setR('d')">${t('d')}</button><button onclick="setR('w')">${t('w')}</button><button onclick="setR('m')">${t('m')}</button>
<input type=date value=${R.from} onchange="R.from=this.value;render()"><input type=date value=${R.to} onchange="R.to=this.value;render()"><button onclick=csv()>${t('csv')}</button><button onclick="print()">${t('print')}</button></div></div>
<div class=gr>${card(t('income'),I,'ok')}${card(t('expense'),E,'bad')}${card(t('net'),I-E)}</div><div class=card><h3>${t('brk')}</h3>${Object.entries(cs).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div style="margin:8px 0"><div class=fl style="justify-content:space-between">${t2(k)}<b>${fmt(v)}</b></div><div class=bar><i style="width:${v/mx*100}%"></i></div></div>`).join('')||t('none')}</div>
<div class=card style="margin-top:12px"><h3>${t('chart')}</h3>${chart()}</div><div class=card style="margin-top:12px"><h3>${t('out')}</h3>${S.persons.map(p=>{const s=pst(p.id);return s.lent-s.rin>.005||s.bor-s.rout>.005?`<div class=row><div class=g1><b>${esc(p.name)}</b></div><div>${s.lent-s.rin>.005?`<span class=ok>${t('theyOwe')}: ${fmt(s.lent-s.rin)}</span> `:''}${s.bor-s.rout>.005?`<span class=bad>${t('iOwe')}: ${fmt(s.bor-s.rout)}</span>`:''}</div></div>`:''}).join('')||t('none')}</div>`}
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const h='date,type,category,person,method,amount,note\n'+rng().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[toLocal(x.date),x.type,x.cat||'',x.pid?person(x.pid).name:'',x.method,x.amount,x.note].map(q).join(',')).join('\n');txt('CSV',h)}
function txt(title,v,ro=1){open(`<h3>${title}</h3><textarea id=ta ${ro?'readonly':''}></textarea><div class=bt>${ro?`<button class=p onclick="$('ta').select();document.execCommand('copy');toast(t('ok'))">${t('copy')}</button>`:`<button class=p onclick=doRestore()>${t('save')}</button>`}<button onclick=closeM()>${t('close')}</button></div>`);$('ta').value=v}
function doRestore(){try{const o=JSON.parse($('ta').value);if(!Array.isArray(o.tx)||!Array.isArray(o.persons)||!Array.isArray(o.goals))throw 0;if(o.tx.some(x=>!TY[x.type]||!(x.amount>0)))throw 0;if(!okLoans(o.tx,o.persons))throw 0;S={...o,lang:S.lang};persist();closeM();render();toast(t('ok'))}catch(e){toast(t('bad'),1)}}
function vSav(){return `<div class=card><h3>${t('newGoal')}</h3><div class=fl><input id=g_n placeholder="${t('goal')}"><input id=g_t type=number min=1 placeholder="${t('target')}" inputmode=decimal><input id=g_d type=date><button class=p onclick=addGoal()>${t('add')}</button></div></div>
${S.goals.map(g=>{const c=g.dep.reduce((s,x)=>s+x.a,0),pc=Math.min(100,c/g.target*100),dl=g.deadline?Math.ceil((new Date(g.deadline+'T00:00:00+06:00')-Date.now())/864e5):null;
return `<div class=card style="margin-top:12px"><div class=fl style="justify-content:space-between"><b>${esc(g.name)}</b><span><button class=i onclick="dep('${g.id}')">＋ ${t('addMoney')}</button> <button class=i onclick="delGoal('${g.id}')">🗑</button></span></div><div class=bar style="margin:8px 0"><i style="width:${pc}%"></i></div>
<small>${t('saved')}: ${fmt(c)} / ${fmt(g.target)} (${pc.toFixed(0)}%) · ${t('left')}: ${fmt(Math.max(0,g.target-c))}${dl!==null?' · '+dl+' '+t('days'):''}</small></div>`}).join('')}`}
function addGoal(){const n=$('g_n').value.trim(),tg=+$('g_t').value;if(!n||!(tg>0))return toast(t('eAmt'),1);S.goals.push({id:uid(),name:n,target:tg,deadline:$('g_d').value,dep:[]});persist();render()}
function dep(id){open(`<h3>${t('addMoney')}</h3><label>${t('amt')}<input id=d_a type=number min=0.01 step=0.01 inputmode=decimal></label><div class=bt><button class=p onclick="saveDep('${id}')">${t('save')}</button><button onclick=closeM()>${t('cancel')}</button></div>`)}
function saveDep(id){const a=Math.round(+$('d_a').value*100)/100;if(!(a>0))return toast(t('eAmt'),1);S.goals.find(g=>g.id==id).dep.push({a,d:new Date().toISOString()});persist();closeM();render()}
function delGoal(id){ask(t('confirmDel'),()=>{S.goals=S.goals.filter(g=>g.id!=id);persist();render()})}
function vSet(){return `<div class=card><div class=bt style="flex-direction:column;align-items:stretch"><button onclick="txt(t('backup'),JSON.stringify(S))">${t('backup')}</button><button onclick="txt(t('restore'),'',0)">${t('restore')}</button><button onclick=seed2()>${t('demo')}</button><button onclick=clrDemo()>${t('clrDemo')}</button><button class=bad onclick=clrAll()>${t('clrAll')}</button></div></div>`}
function seed2(){const l=S.lang;if(S.tx.some(x=>x.demo))return;const keep={tx:S.tx,persons:S.persons,goals:S.goals};seed();S.tx=keep.tx.concat(S.tx);S.persons=keep.persons.concat(S.persons);S.goals=keep.goals.concat(S.goals);S.lang=l;persist();render()}
function clrDemo(){ask(t('confirmDel'),()=>{S.tx=S.tx.filter(x=>!x.demo);S.goals=S.goals.filter(g=>!g.demo);S.persons=S.persons.filter(p=>!p.demo||S.tx.some(x=>x.pid==p.id));persist();render()})}
function clrAll(){ask(t('confirmDel'),()=>{S.tx=[];S.persons=[];S.goals=[];persist();render()})}
function render(){const views={dash:vDash,hist:vHist,dhar:vDhar,led:vLed,rep:vRep,sav:vSav,set:vSet};document.documentElement.lang=S.lang;
$('app').innerHTML=`<header><h1>💰 My Hisab Khata</h1><button onclick="S.lang=S.lang=='bn'?'en':'bn';persist();render()">${t('lang')}</button></header><div class=tabs>${['dash','hist','dhar','rep','sav','set'].map(k=>`<button class="${V==k||(V=='led'&&k=='dhar')?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')}</div>${views[V]()}`;if(V=='hist')LL()}
try{const s=localStorage.getItem('hk');if(s)S=JSON.parse(s);else{seed();persist()}}catch(e){seed()}
render();
</script></body></html>
